name: finetune-cuda
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.12
  - pip
  - pytorch::pytorch>=2.3.0
  - pytorch::torchvision
  - pytorch::pytorch-cuda=12.1
  - pip:
      - transformers>=4.40.0
      - datasets>=2.19.0
      - scikit-learn>=1.4.0
      - pandas>=2.2.0
      - accelerate>=0.29.0
      - jinja2>=3.1.0
      - pyyaml>=6.0.0
      - tensorboard
      - evaluate
